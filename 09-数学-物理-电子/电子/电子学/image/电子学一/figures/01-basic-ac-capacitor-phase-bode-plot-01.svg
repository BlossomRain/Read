      .curve{stroke:#111;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .txt{font-family:"Times New Roman",serif;font-size:18px;fill:#111}
      .small{font-family:"Times New Roman",serif;font-size:16px;fill:#111}
    </style>
  </defs>

  <rect x="0" y="0" width="680" height="360" fill="#fff"/>

  <g transform="translate(72,28)">
    <line class="grid" x1="0" y1="42" x2="540" y2="42"/>
    <line class="grid" x1="0" y1="122" x2="540" y2="122"/>
    <line class="grid" x1="0" y1="202" x2="540" y2="202"/>
