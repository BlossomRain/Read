    <text class="txt" x="-10" y="320">0.1ω₀</text>
    <text class="txt" x="252" y="320">ω₀</text>
    <text class="txt" x="432" y="320">10ω₀</text>
    <text class="txt" x="506" y="344">ω (log scale)</text>

    <text class="small" x="287" y="74">ω = ω₀</text>
    <text class="small" x="287" y="94">phase = -45°</text>
    <text class="small" x="302" y="18">∠T(ω) = -tan⁻¹(ω/ω₀)</text>
