    <line class="grid" x1="450" y1="0" x2="450" y2="280"/>

    <line class="axis" x1="0" y1="282" x2="540" y2="282"/>
    <line class="axis" x1="0" y1="282" x2="0" y2="0"/>

    <path class="curve" d="M0 5
